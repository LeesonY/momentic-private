events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 35M; # Supports single artifact up to 25MiB plus metadata

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Static-file caching. Vite content-hashes everything under /assets/, so it
  # is immutable; index.html and every SPA fallback route must be revalidated or
  # a browser keeps an old HTML that references a removed bundle (seen on 66
  # after a deploy). Empty values add no header, so API/SSE/health are untouched.
  map $uri $cache_control {
    default "no-cache, no-store, must-revalidate";
    ~^/api/ "";
    ~^/internal/ "";
    ~^/assets/ "public, max-age=31536000, immutable";
    = /healthz "";
    = /readyz "";
  }
  add_header Cache-Control $cache_control always;

  # HTTP to HTTPS redirect
  server {
    listen 80;
    server_name _;

    location /healthz {
      access_log off;
      default_type text/plain;
      return 200 "healthy\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Internal service boundary. It is reached over the compose network by
    # authenticated peers only and must never be proxied from the public
    # entrypoint. Reply 404 (not 403) so the public surface does not confirm
    # that the route exists.
    location ^~ /internal/ {
      access_log off;
      return 404;
    }

    # Liveness endpoint for gateway
    location /healthz {
      access_log off;
      default_type text/plain;
      return 200 "healthy\n";
    }

    # Readiness proxy to API readyz
    location /readyz {
      proxy_pass http://api:3000/readyz;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE Event Streams (must disable proxy buffering)
    location ~ ^/api/v1/runs/[^/]+/events$ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off; # authoritative even without upstream X-Accel-Buffering
      proxy_cache off;
      chunked_transfer_encoding off;
      proxy_read_timeout 24h;
    }

    # API endpoints
    location /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      # Retain a non-default external TLS port for same-origin CSRF validation.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Probe requests may run for 120s; leave headroom for API responses.
      proxy_read_timeout 150s;
    }

    # Frontend web application (SPA)
    location / {
      proxy_pass http://web:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
